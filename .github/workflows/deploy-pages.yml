name: QualityOS checks and optional GitHub Pages deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualityos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run full QualityOS test suite
        run: npm test

  deploy-pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
