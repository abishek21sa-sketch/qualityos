services:
  - type: web
    name: qualityos-api
    env: node
    buildCommand: npm install --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: QUALITYOS_DATA_DIR
        value: /var/data
      - key: QUALITYOS_API_TOKEN
        sync: false
      - key: QUALITYOS_API_TOKENS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QUALITYOS_DATABASE_WORKSPACE_ID
        value: 00000000-0000-4000-8000-000000000001
      - key: QUALITYOS_ALLOWED_ORIGIN
        sync: false
    disk:
      name: qualityos-data
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: qualityos
    env: static
    buildCommand: ""
    staticPublishPath: outputs
